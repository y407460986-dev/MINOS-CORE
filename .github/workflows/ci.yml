name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  offline-tests:
    name: Offline tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests -q

  desktop-build:
    name: Desktop build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/desktop-tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Build desktop frontend
        run: npm run build

  windows-sidecar-smoke:
    name: Windows sidecar smoke
    runs-on: windows-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sidecar
        run: powershell -ExecutionPolicy Bypass -File scripts\build_sidecar.ps1

  real-acceptance:
    name: Real API acceptance
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    env:
      MINOS_RUN_REAL_ACCEPTANCE: "1"
      MINOS_OPENAI_API_KEY: ${{ secrets.MINOS_OPENAI_API_KEY }}
      MINOS_OPENAI_MODEL: ${{ vars.MINOS_OPENAI_MODEL }}
      MINOS_OPENAI_BASE_URL: ${{ vars.MINOS_OPENAI_BASE_URL }}
      MINOS_OPENAI_REASONING_EFFORT: ${{ vars.MINOS_OPENAI_REASONING_EFFORT }}
      MINOS_REAL_DRAWING_PATH: ${{ vars.MINOS_REAL_DRAWING_PATH }}
      MINOS_REAL_ACCEPTANCE_OUTPUT_DIR: ${{ vars.MINOS_REAL_ACCEPTANCE_OUTPUT_DIR }}
      MINOS_REAL_PART_FAMILY: ${{ vars.MINOS_REAL_PART_FAMILY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      ARK_MODEL: ${{ vars.ARK_MODEL }}
      ARK_BASE_URL: ${{ vars.ARK_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check real API secret
        run: |
          python - <<'PY'
          import os
          import sys

          if not any(os.getenv(name) for name in ("MINOS_OPENAI_API_KEY", "OPENAI_API_KEY", "ARK_API_KEY")):
              sys.exit("Set MINOS_OPENAI_API_KEY, OPENAI_API_KEY, or ARK_API_KEY before running real acceptance.")
          PY

      - name: Run real API acceptance tests
        run: python -m pytest tests/acceptance/test_real_api_acceptance.py -q -m "real_api and acceptance" --strict-markers
