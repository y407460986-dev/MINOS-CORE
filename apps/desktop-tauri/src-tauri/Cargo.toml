[package]
name = "minos-core-desktop"
version = "3.8.6"
description = "MINOS-CORE v3.8.6 drawing intelligence desktop workbench"
authors = ["MINOS-CORE"]
edition = "2021"

[lib]
name = "minos_core_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
once_cell = "1.19"
rand = "0.8"
