[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["tests/", ".venv/"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minos-core"
version = "3.8.6"
description = "Evidence-driven APQP linkage core for PFD, PFMEA, and control plan workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.1.0,<25.0",
    "httpx>=0.27,<1.0",
    "openpyxl>=3.1,<4.0",
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "shapely>=2.0,<3.0",
    "opencv-python>=4.9,<5.0",
    "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5,<7",
    "diff-cover>=9,<10",
]
dev = [
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pip-audit>=2.7,<3.0",
    "types-PyYAML>=6,<7",
]
desktop-api = [
    "fastapi>=0.100,<1.0",
    "uvicorn>=0.23,<1.0",
    "sse-starlette>=1.6,<3.0",
    "keyring>=24.0,<26.0",
]
platform = [
    "fastapi>=0.100,<1.0",
    "uvicorn>=0.23,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.19,<1.0",
]
ocr = [
    "PyMuPDF>=1.23,<2.0",
    "Pillow>=10,<11.0",
    "rapidocr-onnxruntime>=1.3,<2.0",
    "onnxruntime>=1.16,<2.0",
]
build = [
    "pip-tools>=7,<8",
    "pyinstaller>=6,<7",
]

[project.scripts]
minos-core = "minos_core.cli:main"
minos-platform = "minos_platform.cli:main"
minos-desktop-api = "minos_desktop.api.cli:main"

[tool.setuptools.packages.find]
include = ["minos_core*", "minos_desktop*", "minos_platform*"]

[tool.unittest]
discover_start_dir = "tests"
discover_pattern = "test*.py"

test_command = "python -m unittest discover -s tests -v"
