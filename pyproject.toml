[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minos-core"
version = "2.0.1"
description = "Evidence-driven APQP linkage core for PFD, PFMEA, and control plan workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop-api = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "sse-starlette>=1.6",
]
platform = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
]
ocr = [
    "PyMuPDF>=1.23",
    "Pillow>=10",
    "rapidocr-onnxruntime>=1.3",
    "onnxruntime>=1.16",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
    "openpyxl>=3.1",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "sse-starlette>=1.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "PyMuPDF>=1.23",
    "Pillow>=10",
    "rapidocr-onnxruntime>=1.3",
    "onnxruntime>=1.16",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
    "openpyxl>=3.1",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "sse-starlette>=1.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "PyMuPDF>=1.23",
    "Pillow>=10",
    "rapidocr-onnxruntime>=1.3",
    "onnxruntime>=1.16",
]

[project.scripts]
minos-core = "minos_core.cli:main"
minos-platform = "minos_platform.cli:main"
minos-desktop-api = "minos_desktop.api.cli:main"

[tool.setuptools.packages.find]
include = ["minos_core*", "minos_desktop*", "minos_platform*"]

