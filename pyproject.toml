[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minos-core"
version = "0.0.0"
description = "Evidence-driven APQP linkage core for PFD, PFMEA, and control plan workflows."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
platform = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
]

[project.scripts]
minos-core = "minos_core.cli:main"
minos-platform = "minos_platform.cli:main"

[tool.setuptools]
packages = [
    "minos_core",
    "minos_core.adapters",
    "minos_core.exporters",
    "minos_platform",
    "minos_platform.routers",
]

[tool.unittest]
discover_start_dir = "tests"
discover_pattern = "test*.py"

test_command = "python -m unittest discover -s tests -v"
